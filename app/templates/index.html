<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>BatteryWala | Battery Finder</title><link rel="stylesheet" href="/static/app.css"></head><body><header><div class="brand">Battery<span>Wala</span></div><a href="/admin/login">Admin</a></header><section class="hero"><h1>Power that keeps you moving.</h1><p>Enter your vehicle and usage details to receive a current battery recommendation.</p></section><main class="wrap"><form class="card" id="f"><h2>Find the right battery</h2><div class="grid"><div><label>Name *</label><input name="name" required></div><div><label>Phone *</label><input name="phone" required></div><div><label>Email</label><input type="email" name="email"></div><div><label>Application *</label><select name="application" required><option>Automotive</option><option>Inverter / UPS</option><option>Industrial</option><option>E-mobility</option></select></div><div><label>Vehicle model *</label><input name="vehicle_model" required placeholder="Example: Maruti Swift Petrol"></div><div><label>Preferred brand</label><input name="brand"></div><div><label>Capacity (Ah)</label><input name="capacity_ah" type="number"></div><div><label>Usage</label><select name="usage"><option>Daily</option><option>Commercial</option><option>Occasional</option><option>Heavy duty</option></select></div></div><p class="muted">Recommendations are fitment aids. Please confirm dimensions, terminals, OEM fitment and warranty before sale.</p><button>Get recommendation</button><div id="r" class="result" hidden></div></form></main><script>f.onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(f));r.hidden=false;r.textContent='Checking latest published pricing...';let x=await fetch('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let j=await x.json();if(!x.ok){r.textContent=j.error+': '+(j.fields||[]).join(', ');return}r.textContent=j.prediction?`Recommended model: ${j.prediction.model_no||'Manual verification'}
Brand: ${j.prediction.brand||'Not specified'}
Capacity: ${j.prediction.capacity_ah||'-'} Ah
Dealer price: ₹${j.prediction.dealer_price||'-'}
MRP: ₹${j.prediction.mrp||'-'}
${j.message}`:j.message}</script></body></html>
